PRO_CURSEDUCA_DESCRIPTION: "Cofundador e CTO de uma plataforma SaaS de e-learning para produtos digitais e cursos online. Criei a maior parte das funcionalidades da plataforma na época e desenvolvi o backend em PHP e Zend Framework."
MT4_JOB_DEV: Desenvolvimento full-stack com PHP, HTML, CSS, JavaScript, SQL e NoSQL; engenharia DevOps com AWS e infraestrutura on-premises; e arquitetura de soluções para um grupo de empresas de tecnologia
MT4_JOB_LEAD: Liderei o desenvolvimento e times de engenharia na @MediaPost, plataforma de e-mail marketing que entregava mais de 100.000.000 de e-mails por mês em mais de 100 servidores AWS e on-premises para mais de 1.000 clientes. Responsável pela arquitetura, desenvolvimento, DevOps e manutenção da plataforma
MT4_JOB_CYBER: Desenvolvi funcionalidades de cibersegurança para a segura, solução de Privileged Access Management (PAM) para proteção de infraestrutura, servidores e dados. Criei um novo framework baseado em Symfony para a plataforma
PRO_4LINUX_DESCRIPTION: "Instrutor de alguns cursos livres, como HTML, CSS, JavaScript e PhoneGap"
PRO_OTTERA_DESCRIPTION: "Atuei no desenvolvimento da plataforma OTT utilizando Drupal CMS e conduzi reuniões com clientes, demonstrações de produto e atividades de pré-vendas técnicas que apoiaram a entrada da empresa no mercado brasileiro"
PRO_CODIGOFONTE_DESCRIPTION: Escrevi alguns roteiros para a série "Dicionário do Programador" de um dos maiores canais de YouTube de tecnologia do Brasil
PRO_LETSCODE_DESCRIPTION: "Instrutor no curso de DevOps, além do planejamento, criação de materiais e exercícios para os módulos"
PRO_YAMPI_CONSULTANCY_DESCRIPTION: "Consultoria em TI sobre tomada de decisões, arquitetura de software, segurança de aplicações e boas práticas de engenharia; também ministrei treinamentos técnicos e workshops para uma das maiores empresas de e-commerce do Brasil"
PRO_FUSIONAUTH_DESCRIPTION: "Atuei em Developer Relations e Developer Advocacy para uma plataforma CIAM. Criei artigos técnicos e postagens no blog, além de bibliotecas em diversas linguagens para demonstrar integrações reais com SDKs e APIs"
PRO_ROLE_CONSULTANT_OPERAND_DESCRIPTION: "Prestação de consultoria de TI para diagnosticar problemas em sistemas, identificar gargalos de performance e propor melhorias em arquitetura de software e bancos de dados."
